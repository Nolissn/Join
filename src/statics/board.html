<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join - Board</title>
    <link rel="stylesheet" href="../styles/colors.css">
    <link rel="stylesheet" href="../styles/fonts.css">
    <link rel="stylesheet" href="../styles/standard.css">
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../styles/board.css">
    <script src="../scripts/templates/layoutTemplates.js" defer></script>
    <script src="../scripts/layout.js" defer></script>
    <script src="../scripts/templates/boardTemplates.js" defer></script>
    <script src="../scripts/data/localStorage.js" defer></script>
    <script src="../scripts/board.js" defer></script>
</head>
<body>
    <aside class="sidebar"></aside>
    <div class="pageColumn">
        <header class="header"></header>
        <main class="board">
            <div class="boardHeader">
                <h1 class="boardTitle">Board</h1>
                <div class="boardActions">
                    <div class="boardSearch">
                        <input class="boardSearchInput" type="text" id="findTask" placeholder="Find Task">
                        <button class="boardSearchButton" type="button"><img src="../../assets/icons/search.svg" alt="Search"></button>
                    </div>
                    <button class="boardAddButton" type="button" aria-label="Add task"><span class="boardAddButtonText">Add task</span><img src="../../assets/icons/plus_white.svg" alt=""></button>
                </div>
            </div>

            <div class="boardColumns"></div>
            <dialog class="taskDialog" id="taskDialog">
                <div class="taskDetail" tabindex="-1" autofocus></div>
            </dialog>
        </main>
    </div>
</body>
</html>
