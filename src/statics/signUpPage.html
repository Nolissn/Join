<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join | Sign up</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/join_icon_bright.svg" />
    <link rel="stylesheet" href="../styles/colors.css" />
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/standard.css" />
    <link rel="stylesheet" href="../styles/auth.css" />
    <link rel="stylesheet" href="../styles/sign_up.css" />
    <link rel="stylesheet" href="../../style.css" />
  </head>
  <body>
    <header class="header_auth_screen">
      <img
        class="header_auth_screen_icon_dark"
        src="../../assets/icons/join_icon_dark.svg"
        alt="Join logo"
      />
    </header>
    <main class="main_content_container">
      <div class="auth_card sign_up_card">
        <div class="auth_screen_card_header_container">
          <button onclick="location.href='../../index.html'" class="auth_screen_card_go_back_button" aria-label="Go back">
            <svg
              class="auth_screen_card_go_back_button_icon"
              viewBox="0 0 21 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M4.27563 8.48509H19.1716C19.908 8.48509 20.505 9.08204 20.505 9.81842C20.505 10.5548 19.908 11.1518 19.1716 11.1518H4.27563L10.485 17.3611C11.0056 17.8817 11.0056 18.7258 10.485 19.2464C9.96434 19.767 9.12025 19.767 8.59963 19.2464L0.585843 11.2326C-0.195206 10.4516 -0.195204 9.18526 0.585844 8.40421L8.59963 0.39042C9.12025 -0.130201 9.96434 -0.1302 10.485 0.39042C11.0056 0.911041 11.0056 1.75513 10.485 2.27575L4.27563 8.48509Z"
                fill="currentColor"
              />
            </svg>
          </button>
          <h1 class="auth_card_title sign_up_card_title">Sign up</h1>
        </div>
        <hr class="auth_card_divider" />
        <form class="sign_up_card_form">
          <input
            class="general_auth_card_input_style sign_up_card_input_name"
            type="text"
            id="nameSignUp"
            name="name"
            placeholder="Name"
            aria-label="Name"
          />
          <input
            class="general_auth_card_input_style auth_card_input_email"
            type="text"
            id="emailSignUp"
            name="email"
            placeholder="Email"
            aria-label="Email"
          />
          <input
            class="general_auth_card_input_style auth_card_input_password"
            type="password"
            id="passwordSignUp"
            name="password"
            placeholder="Password"
            aria-label="Password"
          />
          <input
            class="general_auth_card_input_style auth_card_input_password"
            type="password"
            id="confirmPasswordSignUp"
            name="confirm_password"
            placeholder="Confirm Password"
            aria-label="Confirm Password"
          />
        </form>
        <div class="sign_up_card_accept_container">
          <input
            class="sign_up_card_accept_checkbox"
            type="checkbox"
            id="acceptPrivacyPolicy"
            name="accept_privacy_policy"
            aria-label="Accept privacy policy">
            <p class="sign_up_card_accept_text">I accept the <a href="#" class="sign_up_card_accept_link">Privacy Policy</a></p>
        </div>
        <button onclick="signUp()" class="auth_primary_button sign_up_card_sign_up_button">Sign up</button>
      </div>
    </main>
    <footer class="footer_auth_screen">
      <a href="#" class="footer_auth_screen_link">Privacy Policy</a>
      <a href="#" class="footer_auth_screen_link">Legal Notice</a>
    </footer>
    <dialog id="signUpErrorDialog" closedby="any" class="sign_up_error_dialog">
      <button onclick="closeDialog('signUpErrorDialog')" class="sign_up_error_dialog_close_button" aria-label="Close">
        <svg
          class="sign_up_error_dialog_close_button_icon"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            d="M11.9998 13.4L7.0998 18.3C6.91647 18.4834 6.68314 18.575 6.3998 18.575C6.11647 18.575 5.88314 18.4834 5.6998 18.3C5.51647 18.1167 5.4248 17.8834 5.4248 17.6C5.4248 17.3167 5.51647 17.0834 5.6998 16.9L10.5998 12L5.6998 7.10005C5.51647 6.91672 5.4248 6.68338 5.4248 6.40005C5.4248 6.11672 5.51647 5.88338 5.6998 5.70005C5.88314 5.51672 6.11647 5.42505 6.3998 5.42505C6.68314 5.42505 6.91647 5.51672 7.0998 5.70005L11.9998 10.6L16.8998 5.70005C17.0831 5.51672 17.3165 5.42505 17.5998 5.42505C17.8831 5.42505 18.1165 5.51672 18.2998 5.70005C18.4831 5.88338 18.5748 6.11672 18.5748 6.40005C18.5748 6.68338 18.4831 6.91672 18.2998 7.10005L13.3998 12L18.2998 16.9C18.4831 17.0834 18.5748 17.3167 18.5748 17.6C18.5748 17.8834 18.4831 18.1167 18.2998 18.3C18.1165 18.4834 17.8831 18.575 17.5998 18.575C17.3165 18.575 17.0831 18.4834 16.8998 18.3L11.9998 13.4Z"
            fill="currentColor"
          />
        </svg>
      </button>
      <span class="sign_up_error_dialog_title">Attention</span>
      <p class="sign_up_error_dialog_text">You must accept the privacy policy to sign up!</p>
    </dialog>
    <script src="../../scripts.js" defer></script>
    <script type="module" src="../scripts/authentication.js"></script>
  </body>
</html>
