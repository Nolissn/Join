<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join - Add Task</title>
    <link rel="stylesheet" href="../styles/colors.css">
    <link rel="stylesheet" href="../styles/standard.css">
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../styles/addTask.css">
    <script src="../scripts/template.js" defer></script>
    <script src="../scripts/layout.js" defer></script>
</head>
<body>
    <aside class="sidebar"></aside>
    <div class="pageColumn">
        <header class="header"></header>
        <main>
            <h1>Add Task</h1>

            <form>
                <section>
                    <div class="add-task-input-container">
                        <label for="title">Title</label>
                        <input class="add-task-input" type="text" name="title" id="title" placeholder="Enter a title">
                    </div>
                    <div class="add-task-input-container">
                        <label for="description">Description</label>
                        <textarea class="add-task-input" name="description" id="description" placeholder="Enter a description"></textarea>
                    </div>
                    <div class="add-task-input-container">
                        <label for="dueDate">Due Date</label>
                        <input class="add-task-input" type="date" name="dueDate" id="dueDate">
                    </div>
                </section>

                <div class="seperator"></div>

                <section>
                    <div class="add-task-input-container">
                        <label for="priority">Priority</label>
                        <div id="priority">
                            <button>Urgent <img src="../../assets/icons/urgent.svg" alt="Urgent"></button>
                            <button>Medium <img src="../../assets/icons/medium.svg" alt="Medium"></button>
                            <button>Low <img src="../../assets/icons/low.svg" alt="Low"></button>
                        </div>
                    </div>
                    <div class="add-task-input-container">
                        <label for="assigned">Assigned To</label>
                        <select class="add-task-input" name="assigned" id="assigned">
                            <option value="" disabled selected>Select contacts to assign</option>
                            <option value="user1">User 1</option>
                            <option value="user2">User 2</option>
                            <option value="user3">User 3</option>
                        </select>
                    </div>
                    <div class="add-task-input-container">
                        <label for="category">Category</label>
                        <select class="add-task-input" name="category" id="category">
                            <option value="" disabled selected>Select task category</option>
                            <option value="work">Work</option>
                            <option value="personal">Personal</option>
                            <option value="shopping">Shopping</option>
                        </select>
                    </div>
                    <div class="add-task-input-container">
                        <label for="subtasks">Subtasks</label>
                        <input class="add-task-input" type="text" name="subtasks" id="subtasks" placeholder="Add new subtask">
                    </div>
                </section>
            </form>

            <div>
                <button>Clear <img src="../../assets/icons/cancel.svg" alt="Clear"></button>
                <button>Create Task <img src="../../assets/icons/check.svg" alt="Create Task"></button>
            </div>
        </main>
    </div>
</body>
</html>
