<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join - Contacts</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/join_icon_bright.svg" />
    <link rel="stylesheet" href="../styles/colors.css">
    <link rel="stylesheet" href="../styles/fonts.css">
    <link rel="stylesheet" href="../styles/standard.css">
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../styles/contact.css">
    <script src="../scripts/data/currentUser.js"></script>
    <script src="../scripts/pageGuard.js"></script>
    <script src="../scripts/templates/layoutTemplates.js" defer></script>
    <script src="../scripts/template.js" defer></script>
    <script src="../scripts/layout.js" defer></script>
    <script src="../scripts/contact.js" defer></script>
</head>

<body onload="init()">
    <aside class="sidebar"></aside>
    <div class="pageColumn">
        <header class="header"></header>
        <main>
            <!-- contact list -->
            <div class="container-contact-list">
                <button class="add-new-contact-button">
                    <div class="add-new-contact-button-text">Add new contact</div>
                    <img src="../../assets/icons/add_new_contact.svg" alt="">
                </button>
                <div class="contact-list">
                    <div class="contact-list-group">
                        <h3>A</h3>
                        <div class="contact-list-seperator"></div>

                        <button class="contact-list-item contact-list-item-active">
                            <div id="contact_initials_wrapper" class="contact-initials-wrapper">
                                <div class="contact-initials">TW</div>
                            </div>
                            <div class="contact-quick-view">
                                <span class="contact-list-name">Till Schweiger</span>
                                <a class="contact-list-email"
                                    href="mailto:tillschweiger@example.com">tillschweiger@example.com</a>
                            </div>
                        </button>
                        <button class="contact-list-item">
                            <div class="contact-initials">TW</div>
                            <div class="contact-quick-view">
                                <span class="contact-list-name">Till Schweiger</span>
                                <a class="contact-list-email"
                                    href="mailto:tillschweiger@example.com">tillschweiger@example.com</a>
                            </div>
                        </button>
                    </div>

                    <div class="contact-list-group">
                        <h3>B</h3>
                        <div class="contact-list-seperator"></div>
                        <button class="contact-list-item">
                            <div class="contact-initials">RH</div>
                            <div class="contact-quick-view">
                                <span class="contact-list-name">Robert Harris</span>
                                <a href="mailto:robertharris@example.com">robertharris@example.com</a>
                            </div>
                        </button>
                        <button class="contact-list-item">
                            <div class="contact-initials">RH</div>
                            <div class="contact-quick-view">
                                <span class="contact-list-name">Robert Harris</span>
                                <a href="mailto:robertharris@example.com">robertharris@example.com</a>
                            </div>
                        </button>
                        <button class="contact-list-item">
                            <div class="contact-initials">RH</div>
                            <div class="contact-quick-view">
                                <span class="contact-list-name">Robert Harris</span>
                                <a href="mailto:robertharris@example.com">robertharris@example.com</a>
                            </div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- contact infos  --> <!-- responsive d-none  -->
            <section id="section_contact_details" class="section-contact-details">
                <div class="container-contact-info-header">
                    <h2 class="contact-info-title">Contacts</h2>
                    <div class="slogan-seperator"></div>
                    <span class="contact-info-slogan">Better with a team</span>
                    <div class="slogan-seperator-responsive"></div>
                </div>

                <div>
                    <div id="contact_informations" class="container-contact-main">
                        <div class="container-contact-initials">
                            <span class="contact-main-initials">TW</span>
                        </div>
                        <div class="container-contact-action-options">
                            <h3>Tatjana Wolf</h3>
                            <div class="container-contact-action-buttons">
                                <button class="contact-action-button"><img src="../../assets/icons/edit.svg"
                                        alt="Edit">Edit</button>
                                <button class="contact-action-button"><img src="../../assets/icons/delete.svg"
                                        alt="Delete">Delete</button>
                            </div>
                        </div>
                    </div>
                    <br>
                    <div class="contact-information-title">Contact Information</div>
                    <br>
                    <div class="container-contact-information">
                        <div class="container-contact-details">
                            <h5>Email</h5>
                            <a href="mailto:tatjanawolf@example.com">tatjanawolf@example.com</a>
                        </div>
                        <div class="container-contact-details">
                            <h5>Phone</h5>
                            <p>+49 123 456 7890</p>
                        </div>
                    </div>
                </div>
            </section>
    </div>

    <!-- dialog -->

    </main>
    </div>
    <dialog id="dialog" class="dialog">
        <div class="dialog-container">
            <div class="dialog-left-aside">
                <div class="dialog-left-content">
                    <div class="dialog-responsive-close-button">
                        <button><img src="../../assets/icons/cancel_white.svg" alt=""></button>
                    </div>
                    <div class="contact-logo">
                        <img src="../../assets/icons/contact_join.svg" alt="Logo">
                    </div>
                    <div class="contact-option-content">
                        <h2 class="contact-option-title" id="contact_option_title">Edit contact</h2>
                        <p id="contact_option_slogan" class="d-none">Tasks are better with a team!</p>
                        <div class="underline"></div>
                    </div>
                </div>
            </div>

            <div class="dialog-right-content">
                <!-- Dialog Right Title JS change -->
                <div id="dialog_right_title" class="dialog-right-title">
                    <h2 id="dialog_right_title_initials">TW</h2>
                </div>
                <div class="dialog-right-body">
                    <div class="dialog-right-close-button">
                        <button><img src="../../assets/icons/cancel.svg" alt=""></button>
                    </div>
                    <div class="dialog-right-inputs">
                        <div class="input-name-wrapper">
                            <input id="contact_name" class="dialog-input" type="text" placeholder="Name">
                            <img class="input-icons" src="../../assets/icons/input_person.svg" alt="">
                        </div>
                        <div class="input-email-wrapper">
                            <input id="contact_email" class="dialog-input" type="email" placeholder="Email">
                            <img class="input-icons" src="../../assets/icons/input_mail.svg" alt="">
                        </div>
                        <div class="input-phone-wrapper">
                            <input id="contact_phone" class="dialog-input" type="tel" placeholder="Phone">
                            <img class="input-icons" src="../../assets/icons/input_phone.svg" alt="">
                        </div>
                    </div>
                    <!-- Dialog Action Buttons generate JS -->
                    <div id="dialog_action_buttons" class="dialog-action-buttons">
                        <button class="negative-button">Cancel</button>
                        <button class="positive-button">Save <img src="../../assets/icons/check.svg" alt=""></button>
                        <!-- <button class="negative-button">Delete</button>
                                <button class="positive-button">Create contact<img src="../../assets/icons/check.svg" alt=""></button> -->
                    </div>

                </div>
            </div>
        </div>
    </dialog>
</body>

</html>
