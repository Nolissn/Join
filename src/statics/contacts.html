<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join - Contacts</title>
    <link rel="stylesheet" href="../styles/colors.css">
    <link rel="stylesheet" href="../styles/standard.css">
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../styles/contact.css">
    <script src="../scripts/templates/layoutTemplates.js" defer></script>
    <script src="../scripts/template.js" defer></script>
    <script src="../scripts/layout.js" defer></script>
    <script src="../scripts/contact.js" defer></script>
</head>

<body onload="init()">
    <aside class="sidebar"></aside>
    <div class="pageColumn">
        <header class="header"></header>
        <main>
            <dialog id="dialog" class="dialog">
                <div class="dialog-container">
                    <div class="dialog-left-aside">
                        <div class="dialog-left-content">
                            <div class="dialog-responsive-close-button">
                                <button><img src="../../assets/icons/cancel_white.svg" alt=""></button>
                            </div> 
                            <img class="contact-logo" src="../../assets/icons/contact_join.svg" alt="Logo">
                            <div class="contact-option-content">
                                <h2 class="contact-option-title" id="contact_option_title">Edit contact</h2>
                                <!-- <p>Tasks are better with a team!</p> -->
                                <div class="underline"></div>
                            </div>
                        </div>
                    </div>

                    <div class="dialog-right-content">
                        <!-- Dialog Right Title JS change -->
                        <div id="dialog_right_title" class="dialog-right-title">
                            <h2 id="dialog_right_title_initials">TW</h2>
                        </div>
                        <div class="dialog-right-body">
                            <div class="dialog-right-close-button">
                                <button><img src="../../assets/icons/cancel.svg" alt=""></button>
                            </div>
                            <div class="dialog-right-inputs">
                                <div class="input-name-wrapper">
                                    <input id="contact_name" class="dialog-input" type="text" placeholder="Name">
                                    <img class="input-icons" src="../../assets/icons/input_person.svg" alt="">
                                </div>
                                <div class="input-email-wrapper">
                                    <input id="contact_email" class="dialog-input" type="email" placeholder="Email">
                                    <img class="input-icons" src="../../assets/icons/input_mail.svg" alt="">
                                </div>
                                <div class="input-phone-wrapper">
                                    <input id="contact_phone" class="dialog-input" type="tel" placeholder="Phone">
                                    <img class="input-icons" src="../../assets/icons/input_phone.svg" alt="">
                                </div>
                            </div>
                            <!-- Dialog Action Buttons generate JS -->
                            <div id="dialog_action_buttons" class="dialog-action-buttons">
                                <button class="negative-button">Cancel</button>
                                <button class="positive-button">Save <img src="../../assets/icons/check.svg" alt=""></button>
                                <!-- <button class="negative-button">Delete</button>
                                <button class="positive-button">Create contact<img src="../../assets/icons/check.svg" alt=""></button> -->
                            </div>

                        </div>
                    </div>
                </div>
            </dialog>
        </main>
    </div>
</body>

</html>
