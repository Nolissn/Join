<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join - Summary</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/join_icon_bright.svg" />
    <link rel="stylesheet" href="../styles/colors.css">
    <link rel="stylesheet" href="../styles/fonts.css">
    <link rel="stylesheet" href="../styles/standard.css">
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../styles/summary.css">
    <script src="../scripts/templates/layoutTemplates.js" defer></script>
    <script src="../scripts/layout.js" defer></script>
</head>
<body>
    <aside class="sidebar"></aside>
    <div class="pageColumn">
        <header class="header"></header>
        <main>
            <div class="summary-headline">
                <h1>Join 360</h1>
                <div class="seperator"></div>
                <p>Key Metrics at a Glance</p>
            </div>

            <div style="display: flex;">
                <section>
                    <div class="task-summary summary-above">
                        <img src="../../assets/icons/to_do_icon.svg" alt="To-do">
                        <div>
                            <h3>1</h3>
                            <p>To-do</p>
                        </div>
                    </div>

                    <div class="task-summary summary-above">
                        <img src="../../assets/icons/done_icon.svg" alt="Done">
                        <div>
                            <h3>1</h3>
                            <p>Done</p>
                        </div>
                    </div>

                    <div class="task-summary summary-middle">
                        <img src="../../assets/icons/urgent_icon.svg" alt="Urgent">
                        <div>
                            <h3>1</h3>
                            <p>Urgent</p>
                        </div>

                        <div></div>

                        <div>
                            <h4>October 16, 2026</h4>
                            <p>Upcoming Deadline</p>
                        </div>
                    </div>

                    <div class="task-summary summary-below">
                        <h3>5</h3>
                        <p>Tasks in Board</p>
                    </div>

                    <div class="task-summary summary-below">
                        <h3>2</h3>
                        <p>Tasks in Progress</p>
                    </div>

                    <div class="task-summary summary-below">
                        <h3>2</h3>
                        <p>Awaiting Feedback</p>
                    </div>

                </section>

                <div>
                    <b>Good Morning,<span>Sofia Muller</span></b>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
