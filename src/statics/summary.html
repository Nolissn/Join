<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join - Summary</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/join_icon_bright.svg" />
    <link rel="stylesheet" href="../styles/colors.css">
    <link rel="stylesheet" href="../styles/fonts.css">
    <link rel="stylesheet" href="../styles/standard.css">
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../styles/summary.css">
    <script src="../scripts/templates/layoutTemplates.js" defer></script>
    <script src="../scripts/layout.js" defer></script>
</head>
<body>
    <aside class="sidebar"></aside>
    <div class="pageColumn">
        <header class="header"></header>
        <main>
            <div class="summary-container">
                <div class="summary-content">
                    <div class="summary-headline">
                        <h1>Join 360</h1>
                        <div class="seperator"></div>
                        <p class="headline-txt">Key Metrics at a Glance</p>
                    </div>

                    <section>
                        <div class="task-summary summary-above">
                            <img class="summary-icon" src="../../assets/icons/to_do_icon.svg" alt="To-do">
                            <div class="summary-txt-container">
                                <h3>1</h3>
                                <p class="summary-txt">To-do</p>
                            </div>
                        </div>

                        <div class="task-summary summary-above">
                            <img class="summary-icon" src="../../assets/icons/done_icon.svg" alt="Done">
                            <div class="summary-txt-container">
                                <h3>1</h3>
                                <p class="summary-txt">Done</p>
                            </div>
                        </div>

                        <div class="task-summary summary-middle">
                            <img class="summary-icon" src="../../assets/icons/urgent_icon.svg" alt="Urgent">
                            <div class="summary-txt-container">
                                <h3>1</h3>
                                <p class="summary-txt">Urgent</p>
                            </div>

                            <div class="summary-seperator"></div>

                            <div class="summary-txt-container">
                                <h4>October 16, 2026</h4>
                                <p class="summary-txt deadline">Upcoming Deadline</p>
                            </div>
                        </div>

                        <div class="task-summary summary-below">
                            <h3>5</h3>
                            <p class="summary-txt summary-below-txt">Tasks in Board</p>
                        </div>

                        <div class="task-summary summary-below">
                            <h3>2</h3>
                            <p class="summary-txt summary-below-txt">Tasks in Progress</p>
                        </div>

                        <div class="task-summary summary-below">
                            <h3>2</h3>
                            <p class="summary-txt summary-below-txt">Awaiting Feedback</p>
                        </div>
                    </section>
                </div>

                <div class="summary-greeting">
                    <h2>Good Morning,<br><span class="name">Sofia Muller</span></h2>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
