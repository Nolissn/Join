<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join - Summary</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/icons/join_icon_bright.svg" />
    <link rel="stylesheet" href="../styles/colors.css">
    <link rel="stylesheet" href="../styles/fonts.css">
    <link rel="stylesheet" href="../styles/standard.css">
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../styles/summary.css">
    <script src="../scripts/data/currentUser.js"></script>
    <script src="../scripts/pageGuard.js"></script>
    <script src="../scripts/templates/layoutTemplates.js" defer></script>
    <script src="../scripts/layout.js" defer></script>
    <script src="../scripts/summary.js" defer></script>
</head>
<body>
    <aside class="sidebar"></aside>
    <div class="pageColumn">
        <header class="header"></header>
        <main>
            <div class="summary-container">
                <div class="summary-content">
                    <div class="summary-headline">
                        <h1>Join 360</h1>
                        <div class="seperator"></div>
                        <p class="headline-txt">Key Metrics at a Glance</p>
                    </div>

                    <section>
                        <div class="task-summary summary-above">
                            <svg class="summary-icon summary-icon-todo" viewBox="0 0 69 69" role="img" aria-label="To-do" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="34.5" cy="34.5" r="34.5" fill="var(--colorPrimary)"/>
                                <path d="M25.1667 43.8332H27.0333L38.5333 32.3332L36.6667 30.4665L25.1667 41.9665V43.8332ZM44.2333 30.3998L38.5667 24.7998L40.4333 22.9332C40.9444 22.4221 41.5722 22.1665 42.3167 22.1665C43.0611 22.1665 43.6889 22.4221 44.2 22.9332L46.0667 24.7998C46.5778 25.3109 46.8444 25.9276 46.8667 26.6498C46.8889 27.3721 46.6444 27.9887 46.1333 28.4998L44.2333 30.3998ZM42.3 32.3665L28.1667 46.4998H22.5V40.8332L36.6333 26.6998L42.3 32.3665Z" fill="white"/>
                            </svg>
                            <div class="summary-txt-container">
                                <h3>1</h3>
                                <p class="summary-txt">To-do</p>
                            </div>
                        </div>

                        <div class="task-summary summary-above">
                            <svg class="summary-icon summary-icon-done" viewBox="0 0 69 69" role="img" aria-label="Done" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="34.5" cy="34.5" r="34.5" fill="var(--colorPrimary)"/>
                                <path d="M19.5283 34.5001L30.7571 45.5662L49.4717 23.4341" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <div class="summary-txt-container">
                                <h3>1</h3>
                                <p class="summary-txt">Done</p>
                            </div>
                        </div>

                        <div class="task-summary summary-middle">
                            <img class="summary-icon" src="../../assets/icons/urgent_icon.svg" alt="Urgent">
                            <div class="summary-txt-container">
                                <h3>1</h3>
                                <p class="summary-txt">Urgent</p>
                            </div>

                            <div class="summary-seperator"></div>

                            <div class="summary-txt-container">
                                <h4>October 16, 2026</h4>
                                <p class="summary-txt deadline">Upcoming Deadline</p>
                            </div>
                        </div>

                        <div class="task-summary summary-below">
                            <h3>5</h3>
                            <p class="summary-txt summary-below-txt">Tasks in Board</p>
                        </div>

                        <div class="task-summary summary-below">
                            <h3>2</h3>
                            <p class="summary-txt summary-below-txt">Tasks in Progress</p>
                        </div>

                        <div class="task-summary summary-below">
                            <h3>2</h3>
                            <p class="summary-txt summary-below-txt">Awaiting Feedback</p>
                        </div>
                    </section>
                </div>

                <div class="summary-greeting">
                    <h2><span class="greeting-message">Good Morning,</span><br><span class="name"></span></h2>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
