<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join | Log in</title>
    <link rel="stylesheet" href="./src/styles/colors.css" />
    <link rel="stylesheet" href="./src/styles/fonts.css" />
    <link rel="stylesheet" href="./src/styles/standard.css" />
    <link rel="stylesheet" href="./src/styles/auth.css" />
    <link rel="stylesheet" href="./src/styles/login.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="header_auth_screen">
      <img
        class="header_auth_screen_icon_dark"
        src="./assets/icons/join_icon_dark.svg"
        alt="Join logo"
      />
      <div class="header_auth_screen_content_container">
        <p class="header_auth_screen_content_text">Not a Join user?</p>
        <button onclick="location.href='src/statics/signUpPage.html'" class="auth_primary_button header_auth_screen_content_sign_up_button">Sign up</button>
      </div>
    </header>
    <main class="main_content_container">
        <div class="auth_card log_in_card">
          <h1 class="auth_card_title log_in_card_title">Log in</h1>
          <hr class="auth_card_divider"/>
          <form class="log_in_card_form">
            <input class="general_auth_card_input_style auth_card_input_email" type="text" id="email" name="email" placeholder="Email" aria-label="Email">
            <input class="general_auth_card_input_style auth_card_input_password" type="password" id="password" name="password" placeholder="Password" aria-label="Password">
          </form>
          <div class="log_in_card_button_container">
            <button class="auth_primary_button log_in_card_log_in_button">Log in</button>
            <button class="log_in_card_guest_log_in_button">Guest Log in</button>
          </div>
        </div>
    </main>
    <footer class="footer_auth_screen">
        <a href="#" class="footer_auth_screen_link">Privacy Policy</a>
        <a href="#" class="footer_auth_screen_link">Legal Notice</a>
    </footer>
    <script src="./scripts.js" defer></script>
  </body>
</html>
